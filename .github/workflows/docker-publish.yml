name: Build and push Docker image

# Builds the simple-jev runtime image (CUDA 12.4, GPU only) on an Ubuntu runner
# and pushes it to the GitHub Container Registry (GHCR).
#
#   push to main        -> latest, main, sha-<short>
#   push a v* tag       -> latest, v1.2.3, 1.2.3, 1.2, sha-<short>
#   pull request        -> build only, nothing is pushed
#   manual run          -> pick the upstream ref to build
#
# See README.md for the build arguments and for pushing to another registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simple_jev_ref:
        description: "simple-jev ref to build (branch, tag or commit SHA)"
        required: false
        default: main

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # CUDA 12.4 is the image's fixed target: NVIDIA publishes no Ubuntu 24.04
  # build for it, so the base is the 22.04 flavor.
  BASE_IMAGE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
  SIMPLE_JEV_REPO: https://github.com/featherless-ai/simple-jev.git
  SIMPLE_JEV_REF: ${{ inputs.simple_jev_ref || 'main' }}

jobs:
  build-and-push:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # GHCR requires a lowercase path; github.repository keeps its casing.
      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # CUDA 12.4 images are amd64 only. Add linux/arm64 only if you are
          # ready for a much slower emulated build.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            TORCH_INDEX_URL=${{ env.TORCH_INDEX_URL }}
            SIMPLE_JEV_REPO=${{ env.SIMPLE_JEV_REPO }}
            SIMPLE_JEV_REF=${{ env.SIMPLE_JEV_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          {
            echo "### simple-jev image"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| base image | \`${{ env.BASE_IMAGE }}\` |"
            echo "| torch index | \`${{ env.TORCH_INDEX_URL }}\` |"
            echo "| upstream ref | \`${{ env.SIMPLE_JEV_REF }}\` |"
            echo "| pushed | \`${{ github.event_name != 'pull_request' }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
